<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset your password</title></head>
<body style="margin:0;background:#f8f7f2;color:#1e2c39;font:16px/1.6 Arial,sans-serif;padding:32px 14px">
 <div style="max-width:500px;background:white;border:1px solid #dde4dc;border-top:4px solid #ed942f;border-radius:12px;margin:auto;padding:26px">
 <strong style="font-size:23px">Invoice<span style="color:#20754c">Eye</span></strong><h1 style="font-size:24px">Reset your password</h1><p>Use the secure link below to choose a new password for your InvoiceEye account.</p>
 <p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}" style="display:inline-block;background:#20754c;color:white;padding:10px 16px;border-radius:6px;text-decoration:none">Reset password</a></p>
 <p>If the button does not open, copy this link into your browser:</p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}" style="word-break:break-all;color:#20754c">{{ .RedirectTo }}?token_hash={{ .TokenHash }}</a>
 <p style="font-size:13px;color:#57655d">If you did not request this email, you can ignore it.</p></div></body></html>
